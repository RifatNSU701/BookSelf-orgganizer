name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc libsqlite3-dev
      - name: Configure
        run: |
          cmake -S . -B build-ci-release -G Ninja -DCMAKE_BUILD_TYPE=Release -DBSO_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build-ci-release --parallel
      - name: Test
        run: ctest --test-dir build-ci-release --output-on-failure

  sanitizer:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build gcc libsqlite3-dev
      - name: Configure
        run: |
          cmake -S . -B build-ci-sanitizer -G Ninja -DCMAKE_BUILD_TYPE=Debug -DBSO_BUILD_TESTS=ON -DBSO_ENABLE_SANITIZERS=ON
      - name: Build
        run: cmake --build build-ci-sanitizer --parallel
      - name: Test
        run: ctest --test-dir build-ci-sanitizer --output-on-failure
